<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Entre na sua conta do Fluxo de Caixa."
    >
    <title>Fluxo de Caixa | Entrar</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <div class="brand login-brand">
                <div class="brand-icon" aria-hidden="true">FC</div>
                <div>
                    <h1>Fluxo de Caixa</h1>
                    <span>Controle financeiro</span>
                </div>
            </div>

            <h2 id="login-title">Acesse sua conta</h2>
            <p class="login-description">
                Entre para acompanhar suas contas e movimentações.
            </p>

            <form id="login-form" class="login-form">
                <div class="form-field">
                    <label for="email">E-mail</label>
                    <input
                        id="email"
                        name="username"
                        type="email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="senha">Senha</label>
                    <input
                        id="senha"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p
                    id="login-message"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button class="button-primary login-submit" type="submit">
                    Entrar
                </button>
            </form>
            <p class="login-footer">
                Ainda não tem cadastro?
                <a href="cadastro.html">Criar uma conta</a>
            </p>
        </section>
    </main>
</body>
</html>
