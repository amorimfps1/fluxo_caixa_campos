<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Crie uma conta no Fluxo de Caixa."
    >
    <title>Fluxo de Caixa | Criar conta</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/cadastro.js" defer></script>
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card register-card" aria-labelledby="register-title">
            <div class="brand login-brand">
                <div class="brand-icon" aria-hidden="true">FC</div>
                <div>
                    <h1>Fluxo de Caixa</h1>
                    <span>Controle financeiro</span>
                </div>
            </div>

            <h2 id="register-title">Crie sua conta</h2>
            <p class="login-description">
                Use seu Gmail ou outro e-mail para criar uma conta com senha.
            </p>

            <form id="register-form" class="login-form">
                <div class="form-field">
                    <label for="register-name">Nome completo</label>
                    <input
                        id="register-name"
                        name="nome_completo"
                        type="text"
                        autocomplete="name"
                        minlength="3"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="register-cpf">CPF</label>
                    <input
                        id="register-cpf"
                        name="cpf"
                        type="text"
                        inputmode="numeric"
                        autocomplete="off"
                        maxlength="14"
                        aria-describedby="cpf-help"
                        required
                    >
                    <span class="field-help" id="cpf-help">
                        Necessário para criar a conta. Será armazenado cifrado.
                    </span>
                </div>

                <div class="form-field">
                    <label for="register-email">E-mail</label>
                    <input
                        id="register-email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="register-phone">
                        Telefone <span class="field-optional">(opcional)</span>
                    </label>
                    <input
                        id="register-phone"
                        name="telefone"
                        type="tel"
                        inputmode="tel"
                        autocomplete="tel"
                        maxlength="32"
                        placeholder="+55 (11) 98765-4321"
                    >
                    <span class="field-help">
                        Se informado, use entre 10 e 15 dígitos.
                    </span>
                </div>

                <div class="form-field">
                    <label for="register-password">Senha</label>
                    <input
                        id="register-password"
                        name="senha"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="100"
                        required
                    >
                    <span class="field-help">
                        Use letras maiúsculas, minúsculas, números e símbolo.
                    </span>
                </div>

                <div class="form-field">
                    <label for="register-password-confirm">
                        Confirme a senha
                    </label>
                    <input
                        id="register-password-confirm"
                        name="confirmar-senha"
                        type="password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="100"
                        required
                    >
                </div>

                <p
                    id="register-message"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button class="button-primary login-submit" type="submit">
                    Criar conta
                </button>
            </form>

            <p class="login-footer">
                Já tem cadastro?
                <a href="login.html">Entrar</a>
            </p>
        </section>
    </main>
</body>
</html>
